name: Build and Release

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run compile

      - name: Install vsce
        run: npm install -g @vscode/vsce

      - name: Package extension
        run: vsce package

      - name: List VSIX files
        if: github.event_name == 'release'
        run: |
          echo "Checking for VSIX files..."
          ls -la *.vsix || echo "No VSIX files found"
          echo "Upload URL: ${{ github.event.release.upload_url }}"

      - name: Upload VSIX to Release
        if: github.event_name == 'release'
        run: |
          for file in *.vsix; do
            if [ -f "$file" ]; then
              echo "Uploading $file to release ${{ github.event.release.tag_name }}"
              FILENAME=$(basename "$file")
              UPLOAD_URL="${{ github.event.release.upload_url }}?name=$FILENAME"
              echo "Upload URL: $UPLOAD_URL"
              
              HTTP_CODE=$(curl -s -o /tmp/upload_response.txt -w "%{http_code}" \
                -X POST \
                -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                -H "Accept: application/vnd.github.v3+json" \
                -F "file=@$file" \
                "$UPLOAD_URL")
              
              echo "HTTP Status Code: $HTTP_CODE"
              cat /tmp/upload_response.txt
              
              if [ "$HTTP_CODE" -eq 201 ]; then
                echo "✓ Successfully uploaded $file"
              else
                echo "✗ Failed to upload $file (HTTP $HTTP_CODE)"
                exit 1
              fi
            else
              echo "✗ File $file not found"
              exit 1
            fi
          done
